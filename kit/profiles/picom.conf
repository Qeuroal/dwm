shadow = true;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
frame-opacity = 0.9;
corner-radius = 0
blur-kern = "3x3box";
backend = "xrender"
dithered-present = false;
vsync = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
rules: ({
  // Hide WeChat immediately before it captures the desktop.
  match = "class_g = 'wechat' && !override_redirect";
  fade = false;
}, {
  match = "window_type = 'tooltip'";
  fade = false;
  shadow = true;
  opacity = 0.75;
  full-shadow = false;
}, {
  match = "window_type = 'dock'    || "
          "window_type = 'desktop' || "
          "_GTK_FRAME_EXTENTS@";
  blur-background = false;
}, {
  match = "window_type = 'normal' && !override_redirect && !fullscreen && border_width > 0";
  corner-radius = 6;
}, {
  match = "window_type = 'dock' || "
          "window_type = 'desktop'";
  corner-radius = 0;
}, {
  match = "name = 'Notification'   || "
          "class_g = 'Conky'       || "
          "class_g ?= 'Notify-osd' || "
          "class_g = 'Cairo-clock' || "
          "_GTK_FRAME_EXTENTS@";
  shadow = false;
}, {
  // Avoid compositor shadows on menus and application-drawn shadows.
  match = "(class_g = 'com.mitchellh.ghostty' && override_redirect = true) || "
          "class_g = 'wechat' || class_g = 'mailmaster' || "
          "window_type = 'popup_menu' || window_type = 'dropdown_menu' || "
          "(class_g = 'wpp' && override_redirect && window_type = 'utility') || "
          "(class_g = 'wpsoffice' && window_type = 'splash')";
  shadow = false;
}, {
  match = "class_g = 'Dunst' || class_i = 'dunst'";
  shadow = false;
})
